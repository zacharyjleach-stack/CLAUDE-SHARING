[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-sharing"
version = "0.1.0"
description = "Share Claude project context (CLAUDE.md) across team members automatically"
requires-python = ">=3.9"
dependencies = [
    "watchdog>=4.0",
    "gitpython>=3.1",
    "click>=8.1",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
claude-share = "claude_sharing.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["claude_sharing*"]
