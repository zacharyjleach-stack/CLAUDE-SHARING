name: Build desktop installers

# Builds real, no-prerequisite installers (.AppImage / .dmg / .exe) on each
# OS's own runner — electron-builder can't cross-compile native installers,
# so this always needed three machines, not just one. Only the Linux target
# is verified by hand (see README); mac/win are built here but not smoke
# tested the way the Linux AppImage was.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            flag: --linux
          - os: macos-latest
            flag: --mac
          - os: windows-latest
            flag: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npm run build

      # electron-builder's dependency-install step fights npm workspaces'
      # hoisted node_modules (it can't find apps/desktop/node_modules and
      # tries to "fix" that by reinstalling production deps at the
      # workspace root, pruning the devDependencies it needs itself).
      # An empty node_modules here is enough to make it skip that step.
      - name: Package (${{ matrix.os }})
        shell: bash
        working-directory: apps/desktop
        run: |
          mkdir -p node_modules
          npx electron-builder ${{ matrix.flag }} --publish=never

      - uses: actions/upload-artifact@v4
        with:
          name: claude-sharing-${{ matrix.os }}
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.dmg
            apps/desktop/release/*.exe
          if-no-files-found: ignore

  release:
    needs: build
    # Publish whatever installers did build even if one OS's leg failed
    # (fail-fast: false keeps the others running, but a `needs:` dependency
    # still counts the job as failed overall unless told otherwise here).
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # A real "vX.Y.Z" tag push publishes under that tag. A manual
      # workflow_dispatch run (no tag) publishes under a rolling
      # "dev-build" tag instead, so there's always something at
      # /releases/latest/download/<name> to test against between real
      # version tags.
      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=dev-build" >> "$GITHUB_OUTPUT"
          fi

      - name: Create/update GitHub release with the built installers
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          shopt -s nullglob
          files=(artifacts/*/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No installers were produced by any OS — every matrix leg must have failed. Nothing to release."
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" --title "$TAG" --generate-notes
          fi
